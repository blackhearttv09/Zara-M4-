set timeout=3
set default=0

insmod efi_gop
insmod font
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    insmod gfxterm
    set gfxmode=auto
    terminal_output gfxterm
fi

menuentry "M4 Five OS v5.0.0 (Unified AI-Native Linux Kernel 6.8.0-m4)" {
    set gfxpayload=keep
    linux /boot/vmlinuz-m4-kernel quiet splash m4_init=1 apparmor=1 security=m4_sandbox panic=10
    initrd /boot/initrd.img-m4
}

menuentry "M4 Five OS (Failsafe Recovery & Memory Check)" {
    linux /boot/vmlinuz-m4-kernel single m4_recovery=1
    initrd /boot/initrd.img-m4
}
